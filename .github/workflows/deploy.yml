name: CI/CD - ECR + ECS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# id-token: write e necessario para autenticar na AWS via OIDC (sem access keys)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: cluster-crud-books
  AWS_ROLE_ARN: arn:aws:iam::555509860597:role/github-actions-crud-books

# Evita dois deploys simultaneos na mesma branch
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            ecr_repo: crud-books-backend
            container: ctn-crud-books-backend
            ecs_service: svc-crud-books-backend
          - name: frontend
            context: ./frontend
            ecr_repo: crud-books-frontend
            container: ctn-crud-books-frontend
            ecs_service: svc-crud-books-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- CI (pull requests): so valida que a imagem builda ----------
      - name: Validar build da imagem
        if: github.event_name == 'pull_request'
        run: docker build -t test-${{ matrix.name }} ${{ matrix.context }}

      # ---------- CD (push na main): build, push e deploy ----------
      - name: Configurar credenciais AWS (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: ecr
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        id: image
        if: github.event_name != 'pull_request'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ matrix.ecr_repo }}
          TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t "$REGISTRY/$REPOSITORY:$TAG" \
            -t "$REGISTRY/$REPOSITORY:latest" \
            "${{ matrix.context }}"
          docker push --all-tags "$REGISTRY/$REPOSITORY"
          echo "image=$REGISTRY/$REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      # Pega a task definition que o service esta usando agora,
      # assim as variaveis de ambiente e secrets do console sao preservados.
      - name: Baixar task definition atual do service
        if: github.event_name != 'pull_request'
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "${{ matrix.ecs_service }}" \
            --query 'services[0].taskDefinition' --output text)
          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query taskDefinition > task-definition.json

      - name: Atualizar imagem na task definition
        id: render
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.container }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy no ECS
        if: github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ matrix.ecs_service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true