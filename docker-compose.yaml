services:
  db:
    image: mysql:8.4 
    restart: always
    container_name: mysqldb
    env_file:
      - db.env
    ports:
      - 3308:3306
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rede-aplicacao
  backend:
    image: myxenje/node-react-backend
    command: ./wait-for.sh db:3306 -- ./startup.sh
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    restart: always
    container_name: backend
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - 5000:5000
    networks:
      - rede-aplicacao
    depends_on:
      - db
  frontend:
    image: myxenje/node-react-frontend
    build: 
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    restart: always
    container_name: frontend
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - 80:80
    networks:
      - rede-aplicacao
    depends_on:
      - backend
volumes:
  mysql_data:
networks:
  rede-aplicacao:
    driver: bridge


